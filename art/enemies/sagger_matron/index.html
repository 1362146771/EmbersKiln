<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>匣母 · 战斗状态</title><style>body{margin:32px;background:#20252a;color:#e8dec9;font:16px system-ui}h1{font-size:25px}.grid{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:14px}figure{margin:0}img{width:100%;display:block}figcaption{text-align:center;font-size:20px}p{color:#a8b3b8;line-height:1.7}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}</style><h1>封窑兽·匣母</h1><p>拦路 → 封匣 → 开窑 / 破封后泄压 → 散热。战斗立绘跟随当前意图切换。</p><div class="grid"><figure><img src="SPR_SaggerMatron_Bar.png"><figcaption>拦路</figcaption></figure><figure><img src="SPR_SaggerMatron_Seal.png"><figcaption>封匣</figcaption></figure><figure><img src="SPR_SaggerMatron_Fire.png"><figcaption>开窑</figcaption></figure><figure><img src="SPR_SaggerMatron_Vent.png"><figcaption>泄压</figcaption></figure><figure><img src="SPR_SaggerMatron_Cool.png"><figcaption>散热</figcaption></figure></div><p>封匣将整个头藏入甲壳、完全不露眼睛并闭门；开窑展开胸门并亮出炉火；泄压以灰白气流反馈打断成功；散热低伏休息。保持原角色造型和同一缩放、脚底基线。</p></html>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>玩家攻击与受击动画</title>
<style>body{background:#171c23;color:#eee;font:16px system-ui;margin:40px}main{display:flex;gap:24px;flex-wrap:wrap}article{background:#252c35;padding:24px;border-radius:16px}canvas{width:384px;height:384px;background:repeating-conic-gradient(#343d48 0% 25%,#303843 0% 50%) 0/24px 24px}button,select{padding:10px;margin:8px}input{width:280px}small{color:#aebac8}</style>
<h1>玩家 · 攻击 / 受击</h1><p>攻击 8 个全身动作帧，非匀速蓄力、下劈与回收；受击 30 帧 · 30 fps 时间轴 · 攻击 1.4 秒 / 受击 1 秒 · 768 × 768 · 右脚固定</p>
<button id="play">暂停</button><select id="speed"><option value="1">正常速度</option><option value="0.5">半速检查</option><option value="0.25">四分之一速度</option></select><input id="seek" type="range" min="0" max="41" value="0"><span id="counter"></span>
<main><article><h2>攻击 · 挥斧</h2><canvas id="attack" width="768" height="768"></canvas></article><article><h2>受击 · 卸力恢复</h2><canvas id="hurt" width="768" height="768"></canvas></article></main>
<p><small>预览循环播放；Godot 资源设置为单次播放。拖动滑杆可逐帧检查。</small></p>
<script>
const images={}, seek=document.querySelector('#seek'), counter=document.querySelector('#counter');
let playing=true,frame=0,last=performance.now(),phase=0;
function draw(){for(const a of ['attack','hurt']){const n=a==='attack'?[3,11,13,18,24,30,36,42].findIndex(end=>frame<end):frame%30,cols=a==='attack'?2:6;const ctx=document.getElementById(a).getContext('2d');ctx.clearRect(0,0,768,768);ctx.drawImage(images[a],n%cols*768,Math.floor(n/cols)*768,768,768,0,0,768,768)}seek.value=frame;counter.textContent=`时间轴 ${frame+1} / 42 · 攻击帧 ${[3,11,13,18,24,30,36,42].findIndex(end=>frame<end)+1} / 8`}
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'暂停':'播放'};
seek.oninput=()=>{playing=false;document.querySelector('#play').textContent='播放';frame=+seek.value;phase=frame;draw()};
Promise.all(['attack','hurt'].map(a=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);const d=x.getImageData(0,0,c.width,c.height);for(let i=0;i<d.data.length;i+=4){if(!d.data[i+3])continue;let r=(d.data[i]/255)**1.2,g=(d.data[i+1]/255)**1.2,b=(d.data[i+2]/255)**1.2;const y=r*.2126+g*.7152+b*.0722;d.data[i]=(y+(r-y)*1.04)*255;d.data[i+1]=(y+(g-y)*1.04)*255;d.data[i+2]=(y+(b-y)*1.04)*255}x.putImageData(d,0,0);images[a]=c;resolve()};im.onerror=reject;im.src=`${a}/sheet-transparent.png`}))).then(()=>{draw();requestAnimationFrame(function tick(t){if(playing){phase=(phase+(t-last)/1000*30*+document.querySelector('#speed').value)%42;frame=Math.floor(phase);draw()}last=t;requestAnimationFrame(tick)})});
</script></html>

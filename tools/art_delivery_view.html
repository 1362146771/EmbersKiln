<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>炽窑 · 美术交付校对</title>
<style>
:root{color-scheme:dark;--bg:#161c21;--panel:#202931;--line:#3b4650;--ink:#ecede8;--muted:#aebbc4;--accent:#efbc68}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}header{padding:26px 32px 20px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:27px;font-weight:650}p{margin:8px 0;color:var(--muted)}a{color:var(--accent);overflow-wrap:anywhere}button,input,select{font:inherit}button,select,input{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:9px 12px}button{cursor:pointer}button:hover,button:focus-visible{border-color:var(--accent)}button:disabled{opacity:.35;cursor:default}input:focus,select:focus{outline:2px solid var(--accent)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.controls input{flex:1;min-width:220px}.layout{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:75vh}.sidebar{padding:18px;border-right:1px solid var(--line)}#list{display:flex;flex-direction:column;gap:6px}.item{text-align:left;padding:10px 12px;overflow-wrap:anywhere}.item small{display:block;color:var(--muted);font-size:11px}.item.active{border-color:var(--accent);background:#363128}.pager{display:flex;gap:10px;justify-content:space-between;align-items:center;margin:15px 0}.detail{min-width:0;padding:24px 32px 60px}h2{font-size:23px;margin:0 0 6px;overflow-wrap:anywhere}h3{font-size:18px;margin:25px 0 10px}.notice{padding:12px 16px;border-left:3px solid var(--accent);background:#302c24;margin:16px 0}.preview{border:1px solid var(--line);border-radius:9px;min-height:220px;display:grid;place-items:center;padding:18px;background-color:#202830;background-image:linear-gradient(45deg,#39424a 25%,transparent 25%),linear-gradient(-45deg,#39424a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#39424a 75%),linear-gradient(-45deg,transparent 75%,#39424a 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.preview img{max-width:100%;max-height:420px;object-fit:contain}.preview.light{background:#eee9df}.preview.dark{background:#151b24}.preview audio{max-width:100%}.preview-tools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}table{border-collapse:collapse;width:100%;background:var(--panel)}th,td{padding:10px 14px;text-align:left;vertical-align:top;border:1px solid var(--line);overflow-wrap:anywhere}th{color:var(--muted);font-weight:500}td:first-child{width:175px;color:var(--accent)}pre{background:#11171c;padding:16px;overflow:auto;font-size:12px;max-height:420px}details{margin-top:15px}summary{cursor:pointer;color:var(--accent)}.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:2px 10px;color:var(--muted);font-size:12px}.empty{padding:30px;color:var(--muted)}.size-note{font-size:12px}ul{padding-left:22px}@media(max-width:900px){header{padding:20px}.layout{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line);max-height:340px;overflow:auto}.detail{padding:20px}td:first-child{width:125px}th,td{padding:8px}.preview{min-height:150px}}
</style>
</head>
<body>
<header><h1>炽窑 · 美术交付校对</h1><p id="stats"></p><p>逐资产交付表与证据入口。文件实测、设计要求和人工验收分别记录；静态引用不代表运行通过。</p>
<a href="README.md">分册目录</a> · <a href="../../AI_Studio/Design/Art/ASSET_DELIVERY.md">规范与填写说明</a> · <a href="../../AI_Studio/Design/Art/ASSET_DELIVERY_REVIEW.md">待校对问题</a> · <a href="overrides.json">人工确认文件</a>
<div class="controls"><input id="search" aria-label="搜索资产" placeholder="搜索文件名、ID、用途、来源…"><select id="category" aria-label="资产类别"><option value="">全部类别</option></select><select id="scope" aria-label="引用范围"><option value="">全部文件</option><option value="referenced">有静态资源／数据引用</option><option value="unreferenced">未发现静态资源／数据引用</option><option value="image">仅图像／动画预览</option><option value="audio">仅音频</option></select></div>
</header>
<main class="layout"><aside class="sidebar"><div id="resultCount" role="status"></div><div class="pager"><button id="previous">上一页</button><span id="page"></span><button id="next">下一页</button></div><nav id="list" aria-label="资产列表"></nav></aside><article class="detail" id="detail"></article></main>
<script id="catalog" type="application/json">__CATALOG_JSON__</script>
<script>
'use strict';
const catalog=JSON.parse(document.getElementById('catalog').textContent),records=catalog.records;
const labels={audio:'音频',backgrounds:'背景',cards:'卡牌插画',enemies:'敌人',icons:'图标',map:'地图',npcs:'NPC',player:'玩家',references:'参考图',shaders:'转场Shader',themes:'主题资源',ui:'UI',vfx:'特效'};
const byId=new Map(records.map(r=>[r.id,r]));let matches=records,page=0,selected=null;const pageSize=40;
const $=id=>document.getElementById(id),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=p=>'../../'+p.split('/').map(encodeURIComponent).join('/');
const a=p=>'<a href="'+url(p)+'">'+esc(p)+'</a>';
const isImage=r=>/\.(png|jpe?g|webp|gif|svg)$/i.test(r.id),isAudio=r=>/\.(ogg|wav)$/i.test(r.id);
const hasRef=r=>r.refs.some(x=>x.kind!=='验证代码引用');
$('stats').textContent=`${catalog.count} 个文件 · ${Object.keys(catalog.coverage).length} 个类别 · 图片可切换深浅背景`;
for(const [key,count] of Object.entries(catalog.coverage)){$('category').add(new Option(`${labels[key]||key} (${count})`,key));}
const searchText=new Map(records.map(r=>[r.id,[r.id,...Object.values(r.fields),JSON.stringify(r.business),JSON.stringify(r.metadata)].join(' ').toLowerCase()]));
function filter(){const q=$('search').value.trim().toLowerCase(),c=$('category').value,s=$('scope').value;matches=records.filter(r=>(!q||searchText.get(r.id).includes(q))&&(!c||r.category===c)&&(!s||s==='referenced'&&hasRef(r)||s==='unreferenced'&&!hasRef(r)||s==='image'&&isImage(r)||s==='audio'&&isAudio(r)));page=0;renderList();if(matches.length&&!matches.some(r=>r.id===selected))show(matches[0].id);if(!matches.length){selected=null;$('detail').innerHTML='<p class="empty">没有匹配资产，请修改搜索或筛选条件。</p>';}}
function renderList(){$('resultCount').textContent=`匹配 ${matches.length} 个文件`;$('page').textContent=`${matches.length?page+1:0} / ${Math.ceil(matches.length/pageSize)}`;$('previous').disabled=page===0;$('next').disabled=(page+1)*pageSize>=matches.length;$('list').replaceChildren();for(const r of matches.slice(page*pageSize,(page+1)*pageSize)){const b=document.createElement('button');b.className='item'+(r.id===selected?' active':'');b.innerHTML=esc(r.id.split('/').pop())+'<small>'+esc(r.id)+'</small>';b.addEventListener('click',()=>show(r.id));$('list').appendChild(b);}}
function show(id){const r=byId.get(id);if(!r)return;selected=id;history.replaceState(null,'','#'+encodeURIComponent(id));renderList();const m=r.measurement;let preview='';if(isImage(r)){preview='<div id="preview" class="preview"><img id="assetImage" src="'+url(id)+'" alt="'+esc(id)+'"></div><div class="preview-tools"><button data-bg="">棋盘背景</button><button data-bg="light">浅色背景</button><button data-bg="dark">深色背景</button><button data-size="fit">适配预览</button><button data-size="32">32px</button><button data-size="40">40px</button><button data-size="42">42px</button><button data-size="48">48px</button><button data-size="128">128px</button></div><p class="size-note">按钮按CSS宽度缩放，保持原图比例；仅作快速辨识校对，不替代Godot逻辑尺寸、设备像素或实机验收。GIF会按文件自身节奏预览。</p>';}else if(isAudio(r)){preview='<div class="preview"><audio controls preload="none" src="'+url(id)+'"></audio></div><p class="size-note">手动试听；浏览器播放不代表游戏混音、循环与移动端验收通过。</p>';}
const rows=Object.entries(r.fields).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+esc(v)+'</td></tr>').join('');const qa=Object.entries(r.qa).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+esc(v.result)+'</td><td>'+esc(v.evidence)+'</td></tr>').join('');
$('detail').innerHTML='<span class="pill">'+esc(labels[r.category]||r.category)+'</span><h2>'+esc(id.split('/').pop())+'</h2><p>'+a(id)+' · <a href="'+esc(r.table)+'#'+r.anchor+'">Markdown交付表</a></p><div class="notice">'+esc(r.fields['当前状态'])+'</div>'+preview+'<h3>交付表</h3><table><tbody>'+rows+'<tr><td>动画／特效专项</td><td>'+esc(r.animation_or_effect)+'</td></tr></tbody></table><h3>验收记录</h3><table><thead><tr><th>检查项</th><th>结果</th><th>证据／问题</th></tr></thead><tbody>'+qa+'</tbody></table><h3>规范与证据</h3><ul>'+r.fields['依据与参考'].split('；').map(p=>'<li>'+a(p)+'</li>').join('')+r.supporting_files.map(p=>'<li>'+a(p)+'</li>').join('')+r.refs.map(x=>'<li>'+esc(x.kind)+'：'+a(x.file)+(x.line?' · 行 '+x.line:'')+'</li>').join('')+'</ul><details><summary>技术测量与当前文件哈希</summary><pre>'+esc(JSON.stringify(m,null,2))+'</pre></details><details><summary>逐条元数据、业务映射与人工依据</summary><pre>'+esc(JSON.stringify({metadata:r.metadata,business:r.business,manual_evidence:r.manual_evidence},null,2))+'</pre></details><p>人工修订填入 overrides.json 后重建。此页面只读，不会保存审核选择，也不会修改游戏资源。</p>';
document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>$('preview').className='preview '+b.dataset.bg);document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{$('assetImage').style.width=b.dataset.size==='fit'?'auto':b.dataset.size+'px';$('assetImage').style.maxHeight=b.dataset.size==='fit'?'420px':'none';});}
$('search').addEventListener('input',filter);$('category').addEventListener('change',filter);$('scope').addEventListener('change',filter);$('previous').onclick=()=>{page--;renderList();};$('next').onclick=()=>{page++;renderList();};
let initial;try{initial=decodeURIComponent(location.hash.slice(1));}catch{initial='';}renderList();show(byId.has(initial)?initial:records.find(r=>r.id==='art/icons/rewards/ICO_UpgradeShard.png')?.id||records[0]?.id);
</script>
</body>
</html>
